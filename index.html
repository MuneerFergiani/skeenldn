<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Press Kit for skeenldn">
    <title>skeenldn - Press Kit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>skeenldn Press Kit</h1>
            <p>Welcome to the official press kit for skeenldn. Here you'll find logos, screenshots, and other assets.</p>
        </div>
    </header>
    <section class="assets">
        <div class="container">
            <h2>Logos</h2>
            <div class="asset-grid">
                <div class="asset">
                    <img src="assets/logo.png" alt="skeenldn Logo">
                    <p><a href="assets/logo.png" download>Download Logo</a></p>
                </div>
            </div>
        </div>
    </section>
    <section class="screenshots">
        <div class="container">
            <h2>Screenshots</h2>
            <div class="asset-grid">
                <div class="asset">
                    <img src="assets/screenshot1.jpg" alt="skeenldn Screenshot 1">
                    <p><a href="assets/screenshot1.jpg" download>Download Screenshot 1</a></p>
                </div>
                <div class="asset">
                    <img src="assets/screenshot2.jpg" alt="skeenldn Screenshot 2">
                    <p><a href="assets/screenshot2.jpg" download>Download Screenshot 2</a></p>
                </div>
            </div>
        </div>
    </section>
    <footer>
        <div class="container">
            <p>For further inquiries, contact us at <a href="mailto:contact@projectx.com">contact@projectx.com</a></p>
        </div>
    </footer>
</body>
</html>
